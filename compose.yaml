name: cloudheron
services:
  frontend:
    image: cloudheron-frontend:local
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8800}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/ready]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 10s

  api:
    image: cloudheron-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env.docker}"
      VAULT_KEY_B64: "${VAULT_KEY_B64:?Set VAULT_KEY_B64 in .env.docker}"
      S3_BUCKET: "${S3_BUCKET:?Set S3_BUCKET in .env.docker}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_PUBLIC_ENDPOINT_URL: "${S3_PUBLIC_ENDPOINT_URL:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_ADDRESSING_STYLE: "${S3_ADDRESSING_STYLE:-path}"
      S3_ALLOW_HTTP: "${S3_ALLOW_HTTP:-false}"
      S3_CREATE_BUCKET: "${S3_CREATE_BUCKET:-false}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
      WORKERS: "${WORKERS:-2}"
      MAX_PENDING_PER_USER: "${MAX_PENDING_PER_USER:-10}"
      FORWARDED_ALLOW_IPS: "*"
    restart: unless-stopped
    stop_grace_period: 35m
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/ready', timeout=6).close()"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s
