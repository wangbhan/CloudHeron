name: cloudheron
services:
  object-storage:
    image: chrislusf/seaweedfs:4.53
    environment:
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env.docker}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env.docker}"
      S3_BUCKET: "${S3_BUCKET:?Set S3_BUCKET in .env.docker}"
    volumes:
      - objects:/data
    ports:
      - "127.0.0.1:${S3_LOCAL_PORT:-59010}:8333"
    restart: unless-stopped

volumes:
  objects:
