name: cloudheron-v020
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cloudheron
      POSTGRES_DB: cloudheron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudheron -d cloudheron"]
      interval: 5s
      timeout: 3s
      retries: 20
  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?required}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["objects:/data"]
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cloudheron:${POSTGRES_PASSWORD}@postgres:5432/cloudheron
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_ALLOW_HTTP: 'true'
      S3_CREATE_BUCKET: 'true'
    ports: ["127.0.0.1:8800:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      object-storage: {condition: service_started}
volumes:
  pgdata:
  objects:
