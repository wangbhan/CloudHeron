[project]
name = "cloudheron-backend"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143,<0.144", "uvicorn[standard]>=0.54,<0.55", "psycopg[binary,pool]>=3.3,<3.4", "boto3>=1.43,<1.44", "cryptography>=50,<51", "httpx>=0.28,<0.29", "pydantic-settings>=2.15,<3", "python-multipart>=0.0.32,<0.1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 120
